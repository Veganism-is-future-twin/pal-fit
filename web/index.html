<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PAL Fitness</title>
  <meta name="description" content="Daily fitness log, AI coach and leaderboard for Pune Animal Liberation.">
  <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- PWA / install -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PAL Fitness">

  <!-- Speed: open connections early -->
  <link rel="preconnect" href="https://pal-fit-api.omkarwebsitetest.workers.dev" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Inter, loaded without blocking the first paint (system font until it arrives) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">

  <link rel="stylesheet" href="css/app.css">

  <!-- Speed: fetch all app modules in parallel instead of one after another -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/charts.js">
  <link rel="modulepreload" href="js/auth.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="modulepreload" href="js/screens/common.js">
  <link rel="modulepreload" href="js/screens/home.js">
  <link rel="modulepreload" href="js/screens/log.js">
  <link rel="modulepreload" href="js/screens/login.js">
  <link rel="modulepreload" href="js/screens/onboarding.js">
  <link rel="modulepreload" href="js/screens/coach.js">
  <link rel="modulepreload" href="js/screens/board.js">
  <link rel="modulepreload" href="js/screens/profile.js">
  <link rel="modulepreload" href="js/screens/profile-form.js">
  <link rel="modulepreload" href="js/screens/admin.js">
  <script>
    // Apply the saved theme before first paint (avoids a flash).
    try { var t = localStorage.getItem('pal.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <nav id="nav" class="nav" aria-label="Main" hidden></nav>
    <div class="main-col">
      <header id="topbar" class="topbar" hidden></header>
      <main id="view" class="view" tabindex="-1">
        <div class="boot"><div class="spinner" aria-label="Loading"></div></div>
      </main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">PAL Fitness needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
